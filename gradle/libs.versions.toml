[versions]
minSdk = "26"
targetSdk = "35"
compileSdk = "35"
versionCode = "161"
versionName = "1.7.0"
javaVersion = "17"

# Plugins
agp = "8.5.1"
spotless = "6.25.0"
ksp = "2.0.10-RC2-1.0.24"
kotlin = "2.0.10-RC2"
licensee = "1.11.0"

# Android-specific
activity-compose = "1.9.1"
core-ktx = "1.13.1"
core-splashscreen = "1.2.0-alpha01"
media3 = "1.4.0"
appsearch = "1.1.0-alpha03"

retrofit2 = "2.11.0"
http3 = "4.12.0"
junit = "4.13.2"
expresso = "3.6.1"
androidx-test-junit = "1.2.1"
mockk = "1.13.12"
guava = "33.2.1-jre"

# Multiplatform-ready dependencies
kotlinx-coroutines = "1.9.0-RC"
kotlinx-collections-immutable = "0.3.7"
kotlinx-serialization = "1.7.1"
kotlinx-datetime = "0.6.0"
navigation-compose = "2.8.0-alpha08"
viewmodel-compose = "2.8.0"
jetbrains-compose = "1.7.0-alpha02"
koin = "4.0.0-RC1"
koin-compose = "1.2.0-Beta5"
room = "2.7.0-alpha05"
coil = "3.0.0-alpha09"
ktor = '3.0.0-beta-2'
androidx-annotation = "1.8.1"
material-motion-compose = "2.0.1"
colorpicker-compose = "1.1.2"
compose-rules = "0.4.8"
moko-permissions = "0.18.0"

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

androidx-core = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }

ktlint-compose-rules = { module = "io.nlopez.compose.rules:ktlint", version.ref = "compose-rules" }
skydoves-colorpicker-compose = { module = "com.github.skydoves:colorpicker-compose", version.ref = "colorpicker-compose" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
material-motion-compose = { module = "io.github.fornewid:material-motion-compose-core", version.ref = "material-motion-compose" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
androidx-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "viewmodel-compose" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

retrofit2 = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit2" }
retrofit2-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit2" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "http3" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-ios", version.ref = "ktor" }

androidx-appsearch = { module = "androidx.appsearch:appsearch", version.ref = "appsearch" }
androidx-appsearch-compiler = { module = "androidx.appsearch:appsearch-compiler", version.ref = "appsearch" }
androidx-appsearch-localStorage = { module = "androidx.appsearch:appsearch-local-storage", version.ref = "appsearch" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "expresso" }
mockk = { module = "io.mockk:mockk-android", version.ref = "mockk" }

google-guava = { module = "com.google.guava:guava", version.ref = "guava" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin-compose" }

moko-permissions = { module = "dev.icerock.moko:permissions", version.ref = "moko-permissions" }
moko-permissions-compose = { module = "dev.icerock.moko:permissions-compose", version.ref = "moko-permissions" }

# Build-logic dependencies
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
composeCompiler-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "jetbrains-compose" }

[plugins]
androidx-room = { id = "androidx.room", version.ref = "room" }
com-android-application = { id = "com.android.application", version.ref = "agp" }
com-android-library = { id = "com.android.library", version.ref = "agp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
jetbrains-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrains-compose" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }

rafael-spotless = { id = "com.rafael.spotless", version = "unspecified" }
rafael-android-library  = { id = "com.rafael.android.library", version = "unspecified" }
rafael-android-application  = { id = "com.rafael.android.application", version = "unspecified" }
rafael-android-library-compose  = { id = "com.rafael.compose.library", version = "unspecified" }
rafael-android-application-compose  = { id = "com.rafael.compose.application", version = "unspecified" }
